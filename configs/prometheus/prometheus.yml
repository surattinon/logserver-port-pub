global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "graylog"
    metrics_path: /metrics
    static_configs:
      - targets: ["graylog:9833"]

  - job_name: "opensearch"
    metrics_path: /_prometheus/metrics
    static_configs:
      - targets: ["opensearch:9200"]
