name: Quality

# Second CI workflow, complementing config-validation.yml. Three parallel jobs:
#   gitleaks     — full git-history secret scan (blocking)
#   shellcheck   — lint scripts/*.sh (blocking)
#   markdownlint — lint docs (NON-blocking at first; see continue-on-error)
#
# Triggers match config-validation.yml. prod-autobackup is excluded because push
# is scoped to dev only, so svc-logserver's nightly autobackup pushes don't run CI.

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0                 # entire history — required to scan past commits

      - name: Install gitleaks
        # Binary install (MIT-licensed). The official gitleaks-action requires a
        # paid licence for organisation-owned repos; the binary does not.
        run: |
          VER=8.30.1
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            -o gitleaks.tgz
          tar -xzf gitleaks.tgz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan full git history
        # gitleaks 8.30: repo path is a POSITIONAL arg (not --source); --redact=100
        # keeps any finding out of the CI log. Non-zero exit on a finding fails the job.
        run: gitleaks git . --redact=100 --verbose

  shellcheck:
    name: Shellcheck (scripts/*.sh)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run shellcheck
        # shellcheck is preinstalled on ubuntu-latest. --severity=warning skips
        # purely stylistic notes.
        run: |
          shellcheck --version
          mapfile -d '' files < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No shell scripts found — nothing to lint."; exit 0
          fi
          printf 'Linting %d script(s):\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          shellcheck --severity=warning --color=always "${files[@]}"

  markdownlint:
    name: Markdownlint (docs)
    runs-on: ubuntu-latest
    continue-on-error: true             # NON-blocking: surfaces issues without failing the run
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run markdownlint-cli2
        # Node is preinstalled. cli2 auto-detects .markdownlint-cli2.jsonc for rules + globs.
        run: npx --yes markdownlint-cli2
