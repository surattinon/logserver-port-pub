services:
  node-exporter:
    image: "prom/node-exporter:${NODE_EXPORTER_VERSION}"
    container_name: "node-exporter-${ENV}"
    restart: "unless-stopped"
    pid: host
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - "/proc:/host/proc:ro"
      - "/sys:/host/sys:ro"
      - "/:/host/rootfs:ro"
      - "/var/lib/node_exporter/textfile:/host/textfile:ro"
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/host/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.textfile.directory=/host/textfile'
    networks:
      - "logserver_net"
    healthcheck:
      test: 
       - "CMD-SHELL"
       - "wget -q --spider http://127.0.0.1:9100/metrics || exit 1"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
  
  prometheus:
    image: "prom/prometheus:${PROMETHEUS_VERSION}"
    container_name: "prometheus-${ENV}"
    restart: "unless-stopped"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - "${PROMETHEUS_CONFIG_FILE}:/etc/prometheus/prometheus.yml:ro"
      - "${PROMETHEUS_DATA_PATH}:/prometheus"
    networks:
      - "logserver_net"
    deploy:
      resources:
        limits: { memory: 1g, cpus: '1.0' }
        reservations: { memory: 256m }
    healthcheck:
      test: 
        - "CMD-SHELL"
        - "wget -q --spider http://127.0.0.1:9090/-/ready || exit 1"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
